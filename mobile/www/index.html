<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>飯店比價看板</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #f4f6fb;
      color: #1a202c;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    p { font-size: 0.92rem; color: #64748b; line-height: 1.6; margin: 0 0 20px; }
    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏨</div>
    <h1>飯店比價看板</h1>
    <p>正在連線載入最新房價資料…<br>若長時間未回應，請確認網路連線後點擊重試。</p>
    <button onclick="window.location.href='https://andycdmo-sys.github.io/hotel-price-comparator/'">重新連線</button>
  </div>
</body>
</html>

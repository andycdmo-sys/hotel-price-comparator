name: 飯店每日比價排程 (Cloudflare Worker / 網頁觸發)

on:
  # 定時排程已改由 Cloudflare Worker 透過 workflow_dispatch API 準時觸發，避免 GitHub schedule 延遲與重複執行
  workflow_dispatch:
    inputs:
      user_id:
        description: "指定更新與抓價的使用者代號（留空則跑全部）"
        required: false
        default: ""
      profile_json:
        description: "使用者從網頁送出的 Profile JSON 字串"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝 Python 相依套件
        run: pip install -r requirements.txt

      - name: 取得 Playwright 版本作為快取鍵值
        id: playwright-version
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: 快取 Playwright Chromium 瀏覽器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: 安裝 Playwright Chromium 瀏覽器（未命中快取時）
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: 安裝 Playwright 系統相依套件（命中快取時）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: 寫入網頁送出的使用者設定（若有）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_json != '' }}
        env:
          TARGET_USER_ID: ${{ inputs.user_id }}
          PROFILE_JSON: ${{ inputs.profile_json }}
        run: |
          python -c "import os; from pathlib import Path; from src.profiles import save_profile_from_json_str; p = save_profile_from_json_str(os.environ['PROFILE_JSON'], Path('profiles'), expected_user_id=os.environ.get('TARGET_USER_ID', '')); print('Saved profile:', p)"

      - name: 執行使用者追蹤清單比價並更新 CSV 與手機版網頁
        env:
          TZ: Asia/Taipei
          TARGET_USER_ID: ${{ inputs.user_id }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -n "$TARGET_USER_ID" ]; then
            python main.py --profile "$TARGET_USER_ID"
          else
            python main.py --all-profiles
          fi

      - name: 提交並推送最新比價結果與網頁看板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profiles/ output/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update hotel prices ($(date +'%Y-%m-%d %H:%M'))"
            git pull --rebase origin main
            git push
          fi
